<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stockage audio n°1 — Biblio&ESM</title>

  <style>
    :root {
      --ink: #29251f;
      --muted: #756f66;

      --cream: #f7f3ed;
      --white: #fffdf9;

      --brown: #5b4636;
      --brown-dark: #403127;

      --orange: #c66a3d;
      --orange-soft: #f5e2d7;

      --line: #e5ddd2;

      --shadow: 0 12px 35px rgba(55, 43, 31, .08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "DM Sans", Arial, sans-serif;
      color: var(--ink);
      background: var(--cream);
    }

    header {
      width: 100%;
      border-bottom: 1px solid var(--line);
      background: var(--white);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink);
      font-size: 20px;
      font-weight: 700;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brown);
      color: var(--white);
      font-size: 17px;
      font-weight: 800;
    }

    main {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
    }

    .storage-card {
      width: 100%;
      max-width: 650px;
      padding: 55px 35px;
      text-align: center;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 15px;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--orange-soft);
      color: var(--orange);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--brown-dark);
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.1;
      font-weight: 700;
    }

    .line {
      width: 55px;
      height: 4px;
      margin: 22px auto 0;
      border-radius: 999px;
      background: var(--orange);
    }

    footer {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--line);
      background: var(--white);
    }

    @media (max-width: 600px) {
      .header-inner {
        padding: 15px 18px;
      }

      .brand {
        font-size: 18px;
      }

      .logo {
        width: 38px;
        height: 38px;
      }

      main {
        padding: 30px 16px;
      }

      .storage-card {
        padding: 45px 20px;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">
      <a href="#" class="brand">
        <span class="logo">B&</span>
        <span>Biblio&ESM</span>
      </a>
    </div>
  </header>

  <main>
    <section class="storage-card">
      <span class="eyebrow">Stockage</span>

      <h1>Stockage audio n°1</h1>

      <div class="line"></div>
    </section>
  </main>

  <footer>
    Biblio&ESM · Lire. Écouter. Découvrir.
  </footer>

</body>
</html>
